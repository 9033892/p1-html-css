<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hallo Hi Abonnementenoverzicht</title>
    <link rel="stylesheet" href="main.css">
    <style>
        .Doritos {
            background-color: rgb(202, 197, 250);
            color: white;
            padding: 20px;
        }

        .Doritos2 {
            background-color: rgb(137, 137, 237);
            color: white;
            padding: 20px;
        }

        .Doritos3 {
            background-color: black;
            color: white;
            padding: 20px;
        }

        .Kijlanne {
            width: 70%;
        }

        table {
            border-spacing: 0;
        }

        tr:last-child td:last-child {
            border-bottom-right-radius: 60px;
        }
    </style>
</head>

<body style="background-color: blueviolet;">
    <main>
        <h1>Hallo Hi Abonnementenoverzicht</h1>
        <br><br>
        <table class="Kijlanne">
            <tr>
                <th class="Doritos">Abonnement</th>
                <th class="Doritos">Snelheid</th>
                <th class="Doritos">Data</th>
                <th class="Doritos">Maandprijs</th>
            </tr>
            <tr>
                <td class="Doritos2">Basic</td>
                <td class="Doritos3">300mb/s</td>
                <td class="Doritos3">2GB</td>
                <td class="Doritos3">16,50,-</td>
            </tr>
            <tr>
                <td class="Doritos2">Start</td>
                <td class="Doritos3">300mb/s</td>
                <td class="Doritos3">10GB</td>
                <td class="Doritos3">18,00,-</td>
            </tr>
            <tr>
                <td class="Doritos2">Unlimited</td>
                <td class="Doritos3">400mb/s</td>
                <td class="Doritos3">50GB</td>
                <td class="Doritos3">32,50,-</td>
            </tr>
            <tr>
                <td class="Doritos2">Unlimited Plus</td>
                <td class="Doritos3">700mb/s</td>
                <td class="Doritos3">60GB</td>
                <td class="Doritos3">37,50,-</td>
            </tr>

        </table>
    </main>
</body>

</html>
